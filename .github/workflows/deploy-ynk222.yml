name: Deploy youneekproradar.com landing

on:
  push:
    branches:
      - main
      - cursor/fix-weatherbug-jump-weatherkit-c72c
  workflow_dispatch:

jobs:
  sites:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish youneekproradarbaby (youneekproradar.com)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN; skip wrangler deploys."
            exit 0
          fi
          npx wrangler deploy
          echo "Left youneek-pro-radarynk222 alone. That Worker is the radar app."
