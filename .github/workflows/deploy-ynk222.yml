name: Deploy youneek-pro-radarynk222

on:
  push:
    branches:
      - main
      - cursor/fix-weatherbug-jump-weatherkit-c72c
  workflow_dispatch:

jobs:
  website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to youneek-pro-radarynk222
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-website.mjs
