name = "youneek-pro-radarynk222"
compatibility_date = "2024-09-23"
main = "./worker/index.js"

# Landing page Worker. Deploy with:
#   npx wrangler deploy --config wrangler.landing.toml
# Do not merge this name into wrangler.toml — Workers Builds for
# youneekproradarbaby fails if that file names a different Worker.

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
CLOUDFLARE_WORKER_NAME = "youneek-pro-radarynk222"
SITE_ROLE = "landing"
# Set WEATHER_APP_URL to the youneekproradarbaby weather site URL
# so "Open the weather app" leaves this landing origin.
