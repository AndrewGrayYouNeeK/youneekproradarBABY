name = "youneekproradarbaby"
compatibility_date = "2024-09-23"
main = "./worker/index.js"

# Two Cloudflare projects, two jobs:
#   youneekproradarbaby         = weather website (this default Worker)
#   youneek-pro-radarynk222     = landing page    (wrangler deploy --env ynk222)
#
# WeatherKit secrets go only on youneekproradarbaby.
# On the landing project, set WEATHER_APP_URL to the weather Worker URL
# so "Open the weather app" leaves the landing site.

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
CLOUDFLARE_WORKER_NAME = "youneekproradarbaby"
SITE_ROLE = "weather"
# Optional: LANDING_APP_URL = "https://your-landing.pages.dev"

[env.ynk222]
name = "youneek-pro-radarynk222"
compatibility_date = "2024-09-23"
main = "./worker/index.js"

[env.ynk222.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.ynk222.vars]
CLOUDFLARE_WORKER_NAME = "youneek-pro-radarynk222"
SITE_ROLE = "landing"
# Set this to the weather website URL (youneekproradarbaby workers.dev or custom domain):
# WEATHER_APP_URL = "https://youneekproradarbaby.<account>.workers.dev"
