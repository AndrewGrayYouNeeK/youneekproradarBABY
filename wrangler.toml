name = "youneekproradarbaby"
compatibility_date = "2024-09-23"
main = "./worker/index.js"
workers_dev = true

# youneekproradar.com is the public website. Serve the weather app Worker there
# (NOW / Hourly / 10 Day), not the stale YNK222 landing build.
[[routes]]
pattern = "youneekproradar.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# Non-secret defaults can go here. Secrets are set in the Cloudflare dashboard
# or via: npx wrangler secret put WEATHERKIT_TEAM_ID
# WeatherKit secrets: WEATHERKIT_TEAM_ID, WEATHERKIT_KEY_ID, WEATHERKIT_SERVICE_ID, WEATHERKIT_PRIVATE_KEY
# See WEATHERKIT.md for Apple Developer setup.
