name = "youneekproradarbaby"
compatibility_date = "2024-09-23"
main = "./worker/index.js"

# Workers Builds for this project requires this `name` to match the dashboard
# Worker. Do not add another `name =` here (including under [env.*]).
# Deploy the landing site with: wrangler deploy --name youneek-pro-radarynk222

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
CLOUDFLARE_WORKER_NAME = "youneekproradarbaby"
SITE_ROLE = "weather"
# WeatherKit secrets belong on this Worker. See WEATHERKIT.md
