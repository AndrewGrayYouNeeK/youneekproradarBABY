name = "youneekproradarbaby"
compatibility_date = "2024-09-23"
main = "./worker/index.js"

# Weather website Worker. Workers Builds for youneekproradarbaby requires
# this file to contain only this Worker name (no extra [env.*] name fields).
# Landing page config: wrangler.landing.toml

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
CLOUDFLARE_WORKER_NAME = "youneekproradarbaby"
SITE_ROLE = "weather"
# WeatherKit secrets: WEATHERKIT_TEAM_ID, WEATHERKIT_KEY_ID, WEATHERKIT_SERVICE_ID, WEATHERKIT_PRIVATE_KEY
# Set on this Worker only. See WEATHERKIT.md
